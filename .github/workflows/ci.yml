name: CI

on:
  push:
    branches:
      - main
      - renovate/**
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository ||
          !startsWith(github.head_ref, 'renovate/') }}
    name: Run Checks
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            gstreamer1.0-plugins-base \
            gstreamer1.0-tools \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check dependency policy
        run: mise run deps:check

      - name: Check dependency ordering
        run: mise run sort:crates:check

      - name: Check formatting
        run: mise run fmt:check

      - name: Run clippy
        run: mise run lint

      - name: Check build
        run: mise run check

      - name: Run tests
        run: mise run test

      - name: Read minimum supported Rust version
        run: |
          sed -n 's/^rust-version = "\([^"]*\)"$/MSRV=\1/p' Cargo.toml >> "$GITHUB_ENV"

      - name: Cache minimum supported Rust version toolchain
        uses: actions/cache@v5
        with:
          path: ~/.rustup/toolchains/${{ env.MSRV }}-*
          key: rust-msrv-${{ runner.os }}-${{ runner.arch }}-${{ env.MSRV }}

      - name: Install minimum supported Rust version toolchain
        run: mise install "rust@$MSRV"

      - name: Test minimum supported Rust version
        run: cargo +"$MSRV" test --workspace --all-features --locked
