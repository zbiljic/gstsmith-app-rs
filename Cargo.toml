[package]
name = "gstsmith-app"
description = "Runtime building blocks for Rust GStreamer applications."
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
anyhow = { workspace = true }
futures = { workspace = true }
gstreamer = { workspace = true }
tokio = { workspace = true }

[workspace]
members = ["examples/*"]
resolver = "3"

[workspace.package]
authors = ["Nemanja Zbiljic <nemanja.zbiljic@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/zbiljic/gstsmith-app-rs"
rust-version = "1.97.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.104"
futures = "0.3.33"
gstreamer = { version = "0.25.3", features = ["v1_24"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Baseline coverage - enable broad lint groups, then carve out local policy below.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Don't Panic - prevent panics from unwraps and unsafe slicing or indexing.
get_unwrap = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
# expect_used is useful, but keeping it as a warning avoids duplicating rationale
# already present in good expect messages.
expect_used = "warn"
# arithmetic_side_effects is intentionally off for now; it tends to be noisy.
# arithmetic_side_effects = "warn"

# Don't Fail Silently - prevent dropped futures and swallowed errors.
assertions_on_result_states = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
unused_result_ok = "deny"

# Don't Do Bad Async Stuff - prevent deadlocks and concurrency bugs.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "warn"

# Don't Do Unsafe Things with Memory.
mem_forget = "deny"
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"

# Don't Do Potentially Incorrect Things with Numbers.
cast_sign_loss = "warn"
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
# Optional - these force numeric invariants to be documented at cast sites.
# cast_possible_wrap = "warn"
# cast_precision_loss = "warn"
# cast_possible_truncation = "warn"

# Don't Do Bad Things That Are Easy to Avoid.
dbg_macro = "deny"
debug_assert_with_mut_call = "warn"
infallible_try_from = "warn"
iter_not_returning_iterator = "warn"
rc_mutex = "warn"

# Don't `allow` Your Way Around These Lints - every suppression must be
# a deliberate #[expect(..., reason = "...")] rather than a silent #[allow].
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Pedantic lints that are mostly style or documentation policy for this crate.
ignored_unit_patterns = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[lints]
workspace = true
